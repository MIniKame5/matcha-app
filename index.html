<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まっちゃあぷり</title>
    
    <!-- Tailwind CSS CDNをロード -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Interフォントを適用 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* 💚 修正点: 背景をさらに薄い緑にする (ほぼ白に近いフレッシュな色) */
            background-color: #F5FFF5; 
        }
        /* アプリ一覧ヘッダーの緑色の線 */
        .app-list-header {
            position: relative;
            font-size: 1.5rem;
            font-weight: 700;
            color: #4CAF50; /* アプリ一覧の濃い緑色 */
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .app-list-header::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 3px;
            background-color: #8BC34A; /* 線の中間の緑色 */
        }
        /* アプリタイトルのカスタムスタイル (太字の筆文字っぽい緑色) */
        .matcha-title {
            color: #4CAF50;
            font-size: clamp(2.5rem, 8vw, 4rem); /* 画面幅に応じてサイズを調整 */
            font-weight: 900;
            /* 改行防止を維持 */
            white-space: nowrap; 
        }
        /* ぷにっとホバー効果 */
        .app-card {
            /* 基本の影とトランジションは維持 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out; 
            cursor: pointer; /* ポインターカーソルを追加 */
        }
        .app-card:hover {
            /* ぷにっと拡大 (1.02倍) とシャドウ強化 */
            transform: scale(1.02);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1), 0 4px 6px rgba(0, 0, 0, 0.05);
            /* ホバー時の枠線も少し濃くして、浮き上がり感を強調 */
            border-color: #A5D6A7; 
        }

        /* ヘッダーの亀アイコンのサイズ調整 */
        .matcha-turtle {
            font-size: 3rem; /* 少し大きくして、タイトルと合わせる */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <script>
        const BASE_URL = "https://app.matcha-kame.com/apps/";
        const RAW_APP_DATA = [
            {
                id: "meal_planner",
                title: "AI献立プランナー",
                icon: "🍽️",
                description: "AIがあなたの冷蔵庫に合わせて献立を提案するよ！"
            },
            {
                id: "chat_app",
                title: "かめっせーじ",
                icon: "💬",
                description: "友達や家族とリアルタイムで会話を楽しもう！※開発中"
            },
            {
                id: "todo_list",
                title: "シンプルToDoリスト",
                icon: "✅",
                description: "今日のタスクをサクッと管理！忘れ物なし！※開発中"
            }
        ];
        // 新しいパス生成ロジック: apps/{アプリID}/{アプリID}.index
        const APP_DATA = RAW_APP_DATA.map(app => ({
            ...app,
            path: BASE_URL + app.id + '/' + app.id + '.index'
        }));

        /**
         * 1枚のアプリカードの中身のHTML要素を生成する関数 (2列レイアウト用)
         * @param {Object} app - アプリケーションデータオブジェクト
         * @returns {string} - 生成されたHTML文字列
         */
        function createAppCardContent(app) {
            // カードの背景は白を維持
            return `
                <a href="${app.path}" class="app-card w-full p-4 bg-white border border-gray-100 rounded-xl">
                    <div class="flex items-center mb-2">
                        <!-- アイコンはカラフルな絵文字を維持 -->
                        <span class="text-3xl flex-shrink-0 mr-2">${app.icon}</span>
                        
                        <div class="text-lg font-bold text-gray-800">${app.title}</div>
                    </div>
                    <p class="text-xs text-gray-600 mt-1">${app.description}</p>
                </a>
            `;
        }

        /**
         * 2つのアプリカードを並べたHTML要素を生成する関数 (2列レイアウト用)
         * @param {Object} app1 - 1つ目のアプリケーションデータオブジェクト
         * @param {Object} app2 - 2つ目のアプリケーションデータオブジェクト (オプション)
         * @returns {string} - 生成されたHTML文字列
         */
        function createDualAppCard(app1, app2) {
             const card1 = app1 ? createAppCardContent(app1) : '<div class="w-full"></div>'; // 空のdivでレイアウト維持
             const card2 = app2 ? createAppCardContent(app2) : '<div class="w-full"></div>';
            
             return `
                 <div class="grid grid-cols-2 gap-4">
                     ${card1}
                     ${card2}
                 </div>
             `;
        }


        /**
         * アプリ一覧を描画する関数
         */
        function renderAppList() {
            const container = document.getElementById('app-list-container');
            if (container) {
                let html = '';
                for (let i = 0; i < APP_DATA.length; i += 2) {
                    html += createDualAppCard(APP_DATA[i], APP_DATA[i + 1]);
                }
                container.innerHTML = html;
            }
        }

        // DOMContentLoaded後に描画を実行
        document.addEventListener('DOMContentLoaded', renderAppList);
    </script>
    
    <main class="w-full max-w-5xl p-6 pt-12 md:p-8 mx-auto">
        
        <!-- ヘッダーエリア -->
        <header class="text-center mb-10">
            <!-- 絵文字の亀マークを維持 -->
            <div class="flex items-center justify-center mb-1 space-x-4">
                <span role="img" aria-label="亀" class="matcha-turtle flex-shrink-0">🐢</span>
                
                <!-- 改行防止を維持 -->
                <h1 class="matcha-title whitespace-nowrap">まっちゃあぷり</h1>
            </div>
            
            <p class="text-gray-600 text-sm mt-1">AI搭載機能で、もっと便利に！</p>
        </header>

        <!-- アプリ一覧セクション -->
        <section class="mt-8 max-w-4xl mx-auto">
            <h2 class="app-list-header mb-4 w-full">アプリ一覧</h2>
            
            <!-- アプリカードのコンテナ -->
            <div id="app-list-container" class="flex flex-col gap-4">
                <p class="text-center text-gray-500">アプリを読み込み中...</p>
            </div>
        </section>

    </main>
    
    <!-- フッター -->
    <footer class="mt-auto w-full max-w-lg p-6 pb-8 text-center text-xs text-gray-600 mx-auto">
        <p>© 2025 Matcha-Kame All Rights Reserved.</p>
    </footer>

</body>
</html>
