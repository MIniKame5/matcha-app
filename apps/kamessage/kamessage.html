<html lang="ja">
<head>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

        projectId: "kamessage-matcha-kame",

        appId: "1:273786075905:web:24de92c67b70762c207900"

</head>
<body>

    <!-- ===== ログイン画面コンテナ ===== -->
    <div id="login-container" class="login-container">
        <h1>🍵 まっちゃアカウント</h1>
        <p>すべてのまっちゃサービスにログインできます</p>
        <div class="input-group">
            <input type="text" id="username-input" placeholder="希望のID">
            <span>@account.matcha-kame.com</span>
        </div>
        <input type="password" id="password-input" placeholder="パスワード">
        <button id="login-button">ログイン</button>
        <button id="signup-button">アカウント作成</button>
    </div>

    <!-- ===== チャット画面の親ラッパー ===== -->
    <div id="main-wrapper" class="main-wrapper hidden">
        
        <!-- 左側のトークリスト -->
        <div id="user-list-container" class="user-list-container">
            <div class="user-list-header">
                <h2>トーク</h2>
                <button id="new-chat-button" class="new-chat-button">＋</button>
            </div>
            <div id="user-list" class="user-list">
                <!-- JSによって、ここに参加しているトークリストが表示される -->
            </div>
        </div>

        <!-- 右側のチャット画面 -->
        <div id="chat-view-container" class="chat-container">
            <header class="chat-header">
                <h1 id="chat-title">🐢 トークを選択してください</h1>
                <button id="logout-button">ログアウト</button>
            </header>
            <main id="message-list" class="message-list"></main>
            <footer class="message-form-container">
                <form id="message-form" class="message-form">
                    <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
                    <button type="submit">送信</button>
                </form>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
